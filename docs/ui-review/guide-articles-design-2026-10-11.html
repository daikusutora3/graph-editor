<!--
Graph Editor: guide and articles design proposal, 2026-10-11.

Design reference for integrating articles with the existing editor and guide.
This source is a Codex visualization fragment. Preview settings, icons, and
saved preview state use optional host globals (Tweak, lucide, and openai).
Navigation and graph examples are simulated inside the fragment.

Decisions: neutral text links; shared guide examples; contextual input help;
return links that retain reading sections and pending editor input; larger
reader text; expanded reader hit areas; light/dark contrast and press feedback.

Validation: JavaScript syntax, fragment structure, nine navigation/data-state
regressions, and text contrast calculations. Browser rendering, real-device
usability, and production app integration remain unverified.

Apple HIG references consulted:
https://developer.apple.com/design/human-interface-guidelines/accessibility
https://developer.apple.com/design/human-interface-guidelines/buttons
https://developer.apple.com/design/human-interface-guidelines/offering-help
https://developer.apple.com/design/human-interface-guidelines/layout
https://developer.apple.com/design/human-interface-guidelines/color
Native point-size guidance is adapted as a web design choice, not a CSS mandate.
-->

              if (
                state.guideTarget === entry.id ||
                (entry.id === "guide-examples" &&
                  guideData.examples.some(
                    (example) => example.id === state.guideTarget,
                  ))
              )
                link.setAttribute("aria-current", "location");
              nav.append(link);
            });
          });
        guideData.copy.quickStartCards.forEach((data) => {
          const card = clone("ge-guide-start-card-template");
          card.querySelector("[data-graph]").dataset.graph =
            data.id === "data"
              ? "guide-edge"
              : data.id === "sample"
                ? "cycle"
                : "draw";
          card.querySelector("h3").textContent = data.title;
          card.querySelector("p").textContent = data.description;
          data.steps.forEach((step) =>
            card.querySelector("ol").append(textElement("li", step)),
          );
          const link = card.querySelector("a");
          link.href = "#guide-" + data.targetId;
          link.dataset.action = "guide-section";
          link.dataset.target = "guide-" + data.targetId;
          link.querySelector("span").textContent =
            data.id === "data"
              ? guideData.copy.examplesLink
              : guideData.copy.quickStartAction;
          main.querySelector(".ge-guide-start-cards").append(card);
        });
        guideData.examples.forEach((example, index) => {
          const card = clone("ge-guide-example-template");
          const copy = guideData.exampleCopy.examples[index];
          const article = articles.find((a) => a.shared === example.id);
          card.querySelector("h3").id = example.id;
          card.querySelector("h3").textContent = copy.title;
          card.querySelector(".ge-guide-example-description").textContent =
            copy.description;
          card.querySelector("code").textContent = example.input;
          const button = card.querySelector('[data-action="copy"]');
          button.dataset.example = example.id;
          card.querySelector("[data-graph]").dataset.graph = article.graph;
          card.querySelector(".ge-result-caption").textContent = copy.result;
          const link = card.querySelector(".ge-guide-more");
          link.href = "/articles/" + article.slug;
          link.dataset.slug = article.slug;
          link.querySelector("span").textContent = article.more;
          main.querySelector(".ge-guide-examples").append(card);
        });
        guideData.copy.sections.forEach((data) => {
          const section = document.createElement("section");
          section.id = "guide-" + data.id;
          section.append(textElement("h2", data.title));
          if (data.description)
            section.append(textElement("p", data.description));
          (data.paragraphs || []).forEach((p) =>
            section.append(textElement("p", p)),
          );
          if (data.steps) {
            const steps = document.createElement("div");
            steps.className = "ge-guide-steps";
            data.steps.forEach((step) => {
              const row = document.createElement("div");
              row.append(
                textElement("h3", step.title),
                textElement("p", step.description),
              );
              if (data.id === "export" && step.title.includes("TikZ"))
                row.append(
                  articleLink(articles.find((a) => a.slug === "tikz-export")),
                );
              steps.append(row);
            });
            section.append(steps);
          }
          if (data.items) {
            const list = document.createElement("ul");
            data.items.forEach((item) => list.append(textElement("li", item)));
            section.append(list);
          }
          if (data.table) {
            const box = document.createElement("div");
            box.className = "ge-guide-format-table";
            box.append(textElement("h3", data.table.title));
            data.table.rows.forEach(([title, input]) => {
              const row = document.createElement("div");
              row.append(
                textElement("strong", title),
                textElement("pre", input),
              );
              box.append(row);
            });
            section.append(box);
          }
          if (data.shortcuts) {
            const list = document.createElement("dl");
            list.className = "ge-guide-shortcuts";
            data.shortcuts.forEach((item) => {
              list.append(
                textElement("dt", item.action),
                textElement("dd", item.keys.join(" / ")),
              );
            });
            section.append(list);
          }
          if (data.note) {
            const note = document.createElement("aside");
            note.className = "ge-guide-note";
            note.append(
              textElement("strong", data.note.title),
              textElement("p", data.note.text),
            );
            section.append(note);
          }
          if (data.id === "layouts") {
            const links = document.createElement("div");
            links.className = "ge-guide-section-links";
            articles
              .filter((a) =>
                ["tree-layout", "bipartite-graph"].includes(a.slug),
              )
              .forEach((a) => links.append(articleLink(a)));
            section.append(links);
          }
          main.querySelector(".ge-guide-operations").append(section);
        });
        const faq = main.querySelector("#guide-faq");
        const existing = faq.querySelector(".ge-guide-faq");
        existing.remove();
        guideData.copy.faq.forEach((item, index) => {
          const entry = document.createElement("details");
          entry.className = "ge-guide-faq";
          entry.id = "ge-guide-faq-" + index;
          entry.open = state.guideOpenFaq.includes(index);
          const summary = textElement(
            "summary",
            item.question,
            "cursor-interaction",
          );
          const icon = document.createElement("i");
          icon.dataset.lucide = "chevron-down";
          icon.setAttribute("aria-hidden", "true");
          summary.append(icon);
          entry.append(summary, textElement("p", item.answer));
          if (index === 0) entry.append(articleLink(articles[0]));
          faq.append(entry);
        });
        return main;
      }
      function renderReader(product) {
        const reader = clone("ge-reader-template");
        const content = reader.querySelector(".ge-reading-content");
        if (state.screen === "index") {
          const index = clone("ge-index-template");
          const grid = index.querySelector(".ge-article-grid");
          index.querySelector(".ge-index-intro").id = "ge-index-intro";
          articles.forEach((a) => grid.append(card(a)));
          content.append(index);
        } else if (state.screen === "guide") {
          content.append(renderGuide());
          reader
            .querySelector("nav .ge-reading-active")
            .classList.remove("ge-reading-active");
          reader
            .querySelector('nav [data-action="guide"]')
            .classList.add("ge-reading-active");
        } else {
          const a = currentArticle();
          const detail = clone("ge-detail-template");
          detail.querySelector(".ge-detail-category").textContent = a.category;
          detail.querySelector("h1").textContent = a.title;
          detail.querySelector(".ge-detail-intro p").textContent =
            a.description;
          const operation = detail.querySelector(".ge-guide-reference a");
          operation.href = "/guide#" + a.guide;
          operation.dataset.target = a.guide;
          operation.querySelector(".ge-operation-title").textContent =
            a.guideLabel;
          detail.querySelector(".ge-explain-title").textContent = a.explain;
          detail.querySelector(".ge-explain-body").textContent = a.body;
          detail.querySelector("code").textContent = a.code;
          detail.querySelector(".ge-code-label").textContent =
            a.slug === "adjacency-matrix"
              ? "隣接行列"
              : a.shared
                ? "頂点数・辺数つき辺リスト"
                : "辺リスト";
          detail.querySelector(
            ".ge-output-example [data-graph]",
          ).dataset.graph = a.graph;
          detail.querySelector(".ge-points-title").textContent = a.pointTitle;
          a.points.forEach((point) => {
            const li = document.createElement("li");
            li.textContent = point;
            detail.querySelector("ul").append(li);
          });
          const prefix = "ge-" + product.dataset.design + "-" + a.slug;
          detail.querySelector(".ge-detail-intro").id = prefix + "-intro";
          detail.querySelectorAll("[data-section-target]").forEach((el) => {
            el.id = prefix + "-" + el.dataset.sectionTarget;
          });
          detail.querySelectorAll("[data-section]").forEach((el) => {
            el.href = "#" + prefix + "-" + el.dataset.section;
            if (el.dataset.section === "format") el.textContent = a.format;
          });
          detail.querySelector('[data-action="try"]').href =
            "/?example=" + a.slug;
          const common = detail.querySelector(".ge-shared-example-link");
          common.hidden = !a.shared;
          if (a.shared) {
            common.href = "/guide#" + a.shared;
            common.dataset.target = a.shared;
          }
          const related = articles.filter((x) => x.slug !== a.slug).slice(0, 2);
          related.forEach((x) => {
            const link = document.createElement("a");
            link.href = "/articles/" + x.slug;
            link.dataset.action = "article";
            link.dataset.slug = x.slug;
            link.className = "cursor-interaction";
            const label = document.createElement("span");
            label.textContent = x.title;
            link.append(label);
            const icon = document.createElement("i");
            icon.dataset.lucide = "arrow-right";
            icon.setAttribute("aria-hidden", "true");
            link.append(icon);
            detail.querySelector(".ge-related > div").append(link);
          });
          content.append(detail);
        }
        const previous = state.readerHistory.at(-1);
        if (previous) {
          const back = reader.querySelector(".ge-reader-return");
          back.hidden = false;
          const link = back.querySelector("a");
          const article =
            articles.find((a) => a.slug === previous.slug) || articles[0];
          link.href =
            previous.screen === "guide"
              ? "/guide#" + previous.guideTarget
              : previous.screen === "detail"
                ? "/articles/" + article.slug
                : previous.screen === "index"
                  ? "/articles"
                  : "/";
          link.querySelector("span").textContent = previous.input
            ? "入力に戻る"
            : previous.screen === "guide"
              ? "使い方ガイドに戻る"
              : previous.screen === "detail"
                ? "「" + article.title + "」に戻る"
                : "記事一覧に戻る";
        }
        const active = reader.querySelector("nav .ge-reading-active");
        active.setAttribute("aria-current", "page");
        product.querySelector(".ge-screen").replaceChildren(reader);
      }
      function renderEditor(product) {
        const editor = clone("ge-editor-template");
        editor.querySelector(".ge-recommendations").hidden =
          product.dataset.design !== "reading";
        editor.querySelector(".ge-app-menu").hidden = !state.menu;
        editor
          .querySelector('[data-action="menu"]')
          .setAttribute("aria-expanded", String(state.menu));
        const hasGraph =
          state.input ||
          (state.screen === "example"
            ? state.exampleHasGraph
            : state.screen === "editing" || state.hasGraph);
        editor.querySelector(".ge-empty").hidden = hasGraph;
        editor.querySelector(".ge-workspace").hidden = !hasGraph;
        editor.querySelector(".ge-graph-canvas").hidden = state.input;
        editor.querySelector(".ge-input-sheet").hidden = !state.input;
        editor.querySelector(".ge-data-input").value =
          state.screen === "example" ? state.exampleInputData : state.inputData;
        const formatLabel =
          state.screen === "example"
            ? state.exampleFormat === "matrix"
              ? "隣接行列"
              : exampleArticle().shared
                ? "頂点数・辺数つき辺リスト"
                : "辺リスト"
            : "辺リスト";
        editor.querySelector(".ge-data-label").textContent = formatLabel;
        editor
          .querySelector(".ge-data-input")
          .setAttribute("aria-label", formatLabel);
        const help = editor.querySelector(".ge-input-help");
        help.dataset.target =
          state.screen === "example"
            ? exampleArticle().shared || "guide-import"
            : "guide-import";
        help.href = "/guide#" + help.dataset.target;
        if (state.screen === "example") {
          editor.querySelector(".ge-example-banner").hidden = false;
          editor.querySelector(".ge-example-name").textContent =
            exampleArticle().title + "の例";
        }
        product.querySelector(".ge-screen").replaceChildren(editor);
      }
      function renderTabs(product) {
        const tabs = product.querySelector(".ge-preview-tabs");
        tabs.hidden = !state.tabs;
        tabs.replaceChildren();
        if (!state.tabs) return;
        const items = [
          {
            label: "Graph Editor",
            action: "editor",
            active: ["empty", "editing"].includes(state.screen),
          },
          {
            label: state.readerScreen === "guide" ? "使い方ガイド" : "記事",
            action: "reader-tab",
            active: ["index", "detail", "guide"].includes(state.screen),
          },
        ];
        if (state.hasExample || state.screen === "example")
          items.push({
            label: "例のグラフ",
            action: "example-tab",
            active: state.screen === "example",
          });
        items.forEach((item) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "cursor-interaction";
          b.dataset.action = item.action;
          b.setAttribute("aria-pressed", String(item.active));
          const icon = document.createElement("i");
          icon.dataset.lucide =
            item.action === "editor" || item.action === "example-tab"
              ? "network"
              : "file-text";
          icon.setAttribute("aria-hidden", "true");
          b.append(icon);
          const label = document.createElement("span");
          label.textContent = item.label;
          b.append(label);
          tabs.append(b);
        });
      }
      function render() {
        products.forEach((product) => {
          product.classList.toggle("ge-mobile", state.mobile);
          product.dataset.screen = state.screen;
          product.classList.toggle(
            "ge-large-text",
            Number(state.readingScale) >= 1.5,
          );
          product.style.setProperty(
            "--ge-reading-scale",
            String(state.readingScale),
          );
          product.style.colorScheme =
            state.appearance === "auto" ? "" : state.appearance;
          renderTabs(product);
          if (["index", "detail", "guide"].includes(state.screen))
            renderReader(product);
          else renderEditor(product);
          fillGraphs(product);
        });
        if (globalThis.lucide)
          globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }
      function persist() {
        if (globalThis.openai?.setWidgetState)
          globalThis.openai
            .setWidgetState({
              modelContent: {
                screen: state.screen,
                article: state.slug,
                guideSection: state.guideTarget,
                mobile: state.mobile,
              },
              privateContent: { ...state },
            })
            .catch(() => {});
      }
      function announce(message) {
        root.querySelector(".ge-live").textContent = message;
      }
      root.addEventListener("click", async (event) => {
        const control = event.target.closest("[data-action]");
        if (!control || !root.contains(control)) {
          const sectionLink = event.target.closest("[data-section]");
          if (
            sectionLink &&
            root.contains(sectionLink) &&
            isReader(state.screen)
          ) {
            state.readerPositions[readerKey()] = sectionLink
              .getAttribute("href")
              .slice(1);
            persist();
          }
          return;
        }
        event.preventDefault();
        const action = control.dataset.action;
        let scrollTarget = "",
          restoreInput = false;
        if (action === "copy") {
          const label = control.querySelector("span");
          const value = control.dataset.example
            ? sharedExample(control.dataset.example).input
            : currentArticle().code;
          try {
            if (!navigator.clipboard?.writeText)
              throw new Error("clipboard unavailable");
            await navigator.clipboard.writeText(value);
            label.textContent = "コピーしました";
            announce("入力データをコピーしました");
          } catch {
            label.textContent = "データを選択";
            const range = document.createRange();
            range.selectNodeContents(
              control.closest(".ge-input-example").querySelector("code"),
            );
            const selection = globalThis.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            announce("入力データを選択しました。コピーして使えます");
          }
          return;
        }
        if (action === "guide-section" && state.screen === "guide") {
          state.guideTarget = control.dataset.target || "guide-start";
          state.readerPositions.guide = state.guideTarget;
          products[0]
            .querySelectorAll(
              ".ge-guide-contents nav a,.ge-guide-mobile-contents nav a",
            )
            .forEach((link) => {
              if (
                link.dataset.target === state.guideTarget ||
                (link.dataset.target === "guide-examples" &&
                  sharedExample(state.guideTarget))
              )
                link.setAttribute("aria-current", "location");
              else link.removeAttribute("aria-current");
            });
          const contents = control.closest(".ge-guide-mobile-contents");
          if (contents) {
            contents.open = false;
            contents.querySelector("summary").focus({ preventScroll: true });
          }
          products[0]
            .querySelector('[id="' + state.guideTarget + '"]')
            ?.scrollIntoView({ block: "start" });
          persist();
          return;
        }
        if (action === "menu") state.menu = !state.menu;
        else if (action === "index") {
          openReader("index", control);
          scrollTarget = "ge-index-intro";
          announce("記事一覧を開きました。元のエディタは残っています");
        } else if (action === "article") {
          openReader("detail", control, control.dataset.slug);
          scrollTarget = articleAnchor(state.slug);
          announce(currentArticle().title + "を開きました");
        } else if (
          action === "guide" ||
          action === "guide-section" ||
          action === "input-help"
        ) {
          const target =
            control.dataset.target ||
            control.getAttribute("href")?.split("#")[1] ||
            "guide-start";
          openReader("guide", control, state.slug, target);
          scrollTarget = state.guideTarget;
          announce("使い方ガイドの該当箇所を開きました");
        } else if (action === "reader-back") {
          rememberReader();
          const previous = state.readerHistory.at(-1);
          if (!previous) return;
          state.readerHistory = state.readerHistory.slice(0, -1);
          state.screen = previous.screen;
          state.menu = false;
          if (isReader(previous.screen)) {
            state.slug = previous.slug;
            state.guideTarget = previous.guideTarget;
            state.readerScreen = previous.screen;
            state.input = false;
            scrollTarget = previous.anchor;
          } else {
            state.input = Boolean(previous.input);
            restoreInput = state.input;
          }
          announce(
            previous.input
              ? "入力途中のデータに戻りました"
              : "読んでいた箇所に戻りました",
          );
        } else if (action === "editor") {
          openEditor();
          restoreInput = state.input;
          announce("元のエディタを表示しました");
        } else if (action === "try") {
          rememberReader(control);
          state.exampleSlug = state.slug;
          state.exampleGraph = currentArticle().graph;
          state.exampleInputData = currentArticle().code;
          state.exampleAppliedInputData = currentArticle().code;
          state.exampleFormat =
            state.slug === "adjacency-matrix" ? "matrix" : "edge-list";
          state.exampleHasGraph = true;
          state.screen = "example";
          state.hasExample = true;
          state.tabs = true;
          state.input = false;
          state.exampleInput = false;
          state.exampleSelection = null;
          state.menu = false;
          announce("例のデータが入った別のエディタを開きました");
        } else if (action === "example-tab") {
          openEditor(true);
          restoreInput = state.input;
        } else if (action === "back-article") {
          openReader("detail", control, state.exampleSlug);
          scrollTarget =
            state.readerPositions[readerKey()] || articleAnchor(state.slug);
        } else if (action === "reader-tab") {
          rememberEditor();
          state.screen = state.readerScreen;
          state.input = false;
          state.menu = false;
          scrollTarget =
            state.readerPositions[readerKey()] ||
            (state.screen === "guide"
              ? state.guideTarget
              : state.screen === "detail"
                ? articleAnchor(state.slug)
                : "ge-index-intro");
        } else if (action === "theme")
          state.appearance = state.appearance === "dark" ? "light" : "dark";
        else if (action === "paste") {
          state.input = true;
          state[state.screen === "example" ? "exampleInput" : "editorInput"] =
            true;
          state.menu = false;
          restoreInput = true;
        } else if (action === "close-input") {
          state.input = false;
          state[state.screen === "example" ? "exampleInput" : "editorInput"] =
            false;
        } else if (action === "apply-input") {
          const value = control
            .closest(".ge-input-sheet")
            .querySelector("textarea").value;
          if (state.screen === "example") {
            state.exampleInputData = value;
            state.exampleAppliedInputData = value;
            state.exampleHasGraph = true;
            state.exampleGraph = "custom-example";
            state.exampleInput = false;
          } else {
            state.inputData = value;
            state.appliedInputData = value;
            state.hasGraph = true;
            state.screen = "editing";
            state.graph = "custom";
            state.editorInput = false;
          }
          state.input = false;
          announce("入力したデータでグラフを描画しました");
        } else if (action === "sample" || action === "draw") {
          const value = action === "sample" ? "cycle" : "draw";
          if (state.screen === "example") {
            state.exampleHasGraph = true;
            state.exampleGraph = value;
          } else {
            state.hasGraph = true;
            state.graph = value;
            state.screen = "editing";
          }
          state.menu = false;
        } else if (action === "undo") {
          if (state.screen === "example") {
            state.exampleHasGraph = false;
            state.exampleInput = false;
          } else {
            state.hasGraph = false;
            state.screen = "empty";
            state.editorInput = false;
          }
          state.input = false;
        } else if (action === "select") {
          announce("選択ツールを選びました");
          return;
        }
        render();
        persist();
        if (scrollTarget)
          products[0]
            .querySelector('[id="' + scrollTarget + '"]')
            ?.scrollIntoView({ block: "start" });
        if (restoreInput) focusInput();
      });
      root.addEventListener("input", (event) => {
        if (event.target.matches(".ge-data-input")) {
          if (state.screen === "example")
            state.exampleInputData = event.target.value;
          else state.inputData = event.target.value;
          persist();
        }
      });
      globalThis.addEventListener?.("openai:set_globals", (event) => {
        const restored = event.detail?.globals?.widgetState?.privateContent;
        if (restored && typeof restored === "object") {
          Object.assign(state, initial, restored);
          if (!articles.some((a) => a.slug === state.slug))
            state.slug = "edge-list";
          normalizeReadingState();
          initializeUnusedExample();
          render();
        }
      });
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({
          container: root.querySelector(".ge-design-settings"),
          onChange: () => {
            if (products[0].dataset.screen !== state.screen) {
              state.menu = false;
              state.input = false;
              state.readerHistory = [];
              if (["empty", "editing"].includes(state.screen))
                state.hasGraph = state.screen === "editing";
              if (
                ["index", "detail", "example", "guide"].includes(state.screen)
              )
                state.tabs = true;
              if (isReader(state.screen)) state.readerScreen = state.screen;
            }
            render();
            persist();
          },
        });
        tweak.addSelect(state, "screen", {
          label: "表示する画面",
          options: [
            { label: "空のエディタ", value: "empty" },
            { label: "編集中のエディタ", value: "editing" },
            { label: "使い方ガイド", value: "guide" },
            { label: "記事一覧", value: "index" },
            { label: "記事本文", value: "detail" },
            { label: "例を試したエディタ", value: "example" },
          ],
        });
        tweak.addToggle(state, "mobile", { label: "モバイル幅で見る" });
        tweak.addSelect(state, "appearance", {
          label: "配色",
          options: [
            { label: "表示設定に合わせる", value: "auto" },
            { label: "ライト", value: "light" },
            { label: "ダーク", value: "dark" },
          ],
        });
        tweak.addSelect(state, "readingScale", {
          label: "ガイド・記事の文字サイズ",
          options: [
            { label: "100%", value: "1" },
            { label: "125%", value: "1.25" },
            { label: "150%", value: "1.5" },
            { label: "200%", value: "2" },
          ],
        });
      }
    })();
  </script>
</div>
